name: Build & Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flags: --win nsis
          - os: macos-latest
            flags: --mac dmg
          - os: ubuntu-latest
            flags: --linux AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron runtime binary is present
        run: node node_modules/electron/install.js

      - name: Run server unit tests
        run: npm test

      - name: Build server and client
        run: npm run build

      - name: Package & publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.flags }} --publish always
